name: Avisador de directos

# Cómo se mantiene en marcha:
# - Cada pasada lanzada a mano (o por la anterior) espera unos minutos y lanza la siguiente.
#   Así no depende del horario de GitHub, que a veces no arranca o se retrasa mucho.
# - El horario de abajo queda como respaldo: si un día la cadena se corta, lo retoma
#   en cuanto GitHub lo ejecute (y entonces relanza la cadena).
# - Solo puede haber una pasada en marcha y otra en espera, así que nunca se duplican.
# - Para pararlo: Settings → Secrets and variables → Actions → Variables → crea CADENA = no.
#   Para reanudarlo: borra esa variable y pulsa "Run workflow".

on:
  schedule:
    - cron: "2-59/5 * * * *"  # respaldo: cada 5 minutos (fuera de las horas en punto, que van saturadas)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # para guardar estado.json
  actions: write             # para lanzar la siguiente pasada

concurrency:
  group: avisador
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar directos
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_EN_DIRECTO: ${{ secrets.DISCORD_WEBHOOK_EN_DIRECTO }}
          FILTRO: ${{ vars.FILTRO }}
        run: python avisador.py

      - name: Guardar quién está en directo
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "avisador"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Actualiza directos"
            git pull --rebase --quiet
            git push
          fi

      - name: Programar la siguiente pasada
        if: always() && vars.CADENA != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 180
          # GitHub a veces falla un momento (error 500): se reintenta antes de rendirse,
          # porque si esto falla la cadena se corta.
          for intento in 1 2 3 4 5 6; do
            if gh workflow run avisador.yml -R "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            echo "Intento $intento fallido, reintento en $((intento * 15)) s"
            sleep $((intento * 15))
          done
          exit 1
