name: Avisador de directos

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # para guardar estado.json

concurrency:
  group: avisador
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar directos
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_EN_DIRECTO: ${{ secrets.DISCORD_WEBHOOK_EN_DIRECTO }}
          FILTRO: ${{ vars.FILTRO }}
        run: python avisador.py

      - name: Guardar quién está en directo
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "avisador"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Actualiza directos"
            git push
          fi
